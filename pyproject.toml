[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperqa"
version = "0.0.1"
description = "Document QA for scientific papers with page-level citations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jounes" }]
keywords = ["document-qa", "scientific-papers", "arxiv", "rag", "huggingface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "pypdf>=4,<7",
]

[project.optional-dependencies]
# Heavy ML runtime — not needed for unit tests or the Passage/Index core.
# Install with `pip install -e ".[embed]"` when you need the real embedder.
embed = [
    "sentence-transformers>=3,<5",
]
# HF Inference API backend. Install with `pip install -e ".[llm]"`.
llm = [
    "huggingface-hub>=0.24,<1",
]
# Gradio UI (HF Space entry point).  Install with `pip install -e ".[app]"`.
app = [
    "gradio>=4,<6",
]
# Visual retrieval (ColPali). Heavy + GPU-only at runtime. Install with
# `pip install -e ".[visual]"`.  The torch dep is intentionally NOT pinned
# here — ColPali pulls it transitively, and pinning it would conflict
# with whatever torch the deploy target's GPU drivers expect.
visual = [
    "colpali-engine>=0.3,<0.4",
    "pypdfium2>=4,<5",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/jounes/paperQA"
Issues = "https://github.com/jounes/paperQA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paperqa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced set; expand deliberately.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m "not integration" excludes the tests that need HF_TOKEN / network.
# Run integration tests explicitly with: pytest -m integration
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: requires network and/or external services (skipped in default runs)",
]

[tool.mypy]
python_version = "3.11"
strict = true

# sentence-transformers ships no type stubs. It is an optional runtime
# extra (see [project.optional-dependencies].embed), so the import-untyped
# warning would break CI for users who don't install the extra.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

# huggingface_hub ships inconsistent stubs across versions; treat as untyped.
[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

# gradio does not ship stubs; treat as untyped.
[[tool.mypy.overrides]]
module = "gradio.*"
ignore_missing_imports = true

# colpali-engine, pypdfium2, PIL: optional [visual] runtime deps with no
# stubs. Treat as untyped so CI without [visual] still type-checks.
[[tool.mypy.overrides]]
module = ["colpali_engine.*", "pypdfium2.*", "PIL.*", "torch.*"]
ignore_missing_imports = true

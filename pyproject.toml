[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperqa"
version = "0.0.1"
description = "Document QA for scientific papers with page-level citations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jounes" }]
keywords = ["document-qa", "scientific-papers", "arxiv", "rag", "huggingface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Pinned in a follow-up commit once model choice is locked.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/jounes/paperQA"
Issues = "https://github.com/jounes/paperQA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paperqa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced set; expand deliberately.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true

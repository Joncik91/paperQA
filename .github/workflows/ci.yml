# CI — lint, typecheck, test on every push and pull request.
#
# WHY: CONTRIBUTING.md promises ruff + mypy strict + pytest pass before any
# change lands. Running them in GitHub Actions is the enforcement mechanism
# for that promise. If this workflow goes red on main, the discipline story
# is broken and fixing it takes priority over new features.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src/

      - name: Pytest
        run: pytest -q
